; BatteryWatch - big "charge tonight" message in the centre of the desktop.
; Invisible until the mouse or headset is at or below its threshold.
[Rainmeter]
Update=5000
AccurateText=1
DynamicWindowSize=1
; On Desktop (behind every window), ignore clicks, can't be dragged, centred.
OnRefreshAction=[!ZPos "-2"][!ClickThrough "1"][!Draggable "0"][!SetWindowPosition "50%" "50%" "50%" "50%"]

[Metadata]
Name=BatteryWatch Warning
Information=Centre-of-desktop reminder when a battery is low.

[Variables]
@Include=#@#Settings.inc
MouseWarning=0
HeadsetWarning=0

[MeasureMouse]
Measure=Plugin
Plugin=BatteryWatch
Device=Mouse
PollSeconds=#PollSeconds#

[MeasureHeadset]
Measure=Plugin
Plugin=BatteryWatch
Device=Headset
PollSeconds=#PollSeconds#

; Keep a low-battery warning latched while the reading is unavailable.
[MeasureMouseWarning]
Measure=Calc
Formula=MeasureMouse
IfCondition=(MeasureMouse >= 0) && (MeasureMouse <= #MouseThreshold#)
IfTrueAction=[!SetVariable MouseWarning 1][!UpdateMeasure MeasureLowState]
IfCondition2=MeasureMouse > #MouseThreshold#
IfTrueAction2=[!SetVariable MouseWarning 0][!UpdateMeasure MeasureLowState]

[MeasureHeadsetWarning]
Measure=Calc
Formula=MeasureHeadset
IfCondition=(MeasureHeadset >= 0) && (MeasureHeadset <= #HeadsetThreshold#)
IfTrueAction=[!SetVariable HeadsetWarning 1][!UpdateMeasure MeasureLowState]
IfCondition2=MeasureHeadset > #HeadsetThreshold#
IfTrueAction2=[!SetVariable HeadsetWarning 0][!UpdateMeasure MeasureLowState]

; 0 = all fine, 1 = mouse low, 2 = headset low, 3 = both low.
[MeasureLowState]
Measure=Calc
Formula=#MouseWarning# + 2 * #HeadsetWarning#
DynamicVariables=1
IfCondition=MeasureLowState = 0
IfTrueAction=[!HideMeterGroup Warning][!Redraw]
IfCondition2=MeasureLowState = 1
IfTrueAction2=[!SetOption MeterTitle Text "#MouseTitle#"][!ShowMeterGroup Warning][!UpdateMeterGroup Warning][!Redraw]
IfCondition3=MeasureLowState = 2
IfTrueAction3=[!SetOption MeterTitle Text "#HeadsetTitle#"][!ShowMeterGroup Warning][!UpdateMeterGroup Warning][!Redraw]
IfCondition4=MeasureLowState = 3
IfTrueAction4=[!SetOption MeterTitle Text "#BothTitle#"][!ShowMeterGroup Warning][!UpdateMeterGroup Warning][!Redraw]

; Invisible 1000px-wide strip so the centred text always has room.
[MeterSpacer]
Meter=Image
W=1000
H=1
SolidColor=0,0,0,1
Group=Warning
Hidden=1

[MeterTitle]
Meter=String
Text=
X=500
Y=0
StringAlign=Center
FontFace=#FontFace#
FontSize=#WarningTitleSize#
FontColor=#WarningTitleColor#
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
Group=Warning
Hidden=1
