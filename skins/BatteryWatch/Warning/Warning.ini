; BatteryWatch - big "charge tonight" message in the centre of the desktop.
; Invisible until the mouse or headset is at or below its threshold.
[Rainmeter]
Update=5000
AccurateText=1
DynamicWindowSize=1
; On Desktop (behind every window), ignore clicks, can't be dragged, centred.
OnRefreshAction=[!ZPos "-2"][!ClickThrough "1"][!Draggable "0"][!SetWindowPosition "50%" "50%" "50%" "50%"]

[Metadata]
Name=BatteryWatch Warning
Information=Centre-of-desktop reminder when a battery is low.

[Variables]
@Include=#@#Settings.inc

[MeasureMouse]
Measure=Plugin
Plugin=BatteryWatch
Device=Mouse
PollSeconds=#PollSeconds#

[MeasureHeadset]
Measure=Plugin
Plugin=BatteryWatch
Device=Headset
PollSeconds=#PollSeconds#

; 0 = all fine, 1 = mouse low, 2 = headset low, 3 = both low.
; A value of -1 means "not read yet" and never counts as low.
[MeasureLowState]
Measure=Calc
Formula=((MeasureMouse >= 0) && (MeasureMouse <= #MouseThreshold#)) + 2 * ((MeasureHeadset >= 0) && (MeasureHeadset <= #HeadsetThreshold#))
IfCondition=MeasureLowState = 0
IfTrueAction=[!HideMeterGroup Warning][!Redraw]
IfCondition2=MeasureLowState = 1
