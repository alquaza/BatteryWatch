; BatteryWatch - small battery readout pinned to the top-right of the desktop.
[Rainmeter]
Update=5000
AccurateText=1
DynamicWindowSize=1
; On Desktop (behind every window), ignore clicks, can't be dragged, top-right corner.
OnRefreshAction=[!ZPos "-2"][!ClickThrough "1"][!Draggable "0"][!SetWindowPosition "100%" "0" "100%" "0"]

[Metadata]
Name=BatteryWatch Corner
Information=Mouse and headset battery in the top-right corner.

[Variables]
@Include=#@#Settings.inc

[MeasureMouse]
Measure=Plugin
Plugin=BatteryWatch
Device=Mouse
PollSeconds=#PollSeconds#

[MeasureHeadset]
Measure=Plugin
Plugin=BatteryWatch
Device=Headset
PollSeconds=#PollSeconds#

[MeterText]
Meter=String
MeasureName=MeasureMouse
MeasureName2=MeasureHeadset
Text=Mouse %1     Headset %2
FontFace=#FontFace#
FontSize=#CornerFontSize#
FontColor=#CornerColor#
StringEffect=Shadow
FontEffectColor=#ShadowColor#
AntiAlias=1
Padding=0,#CornerGap#,#CornerGap#,0
